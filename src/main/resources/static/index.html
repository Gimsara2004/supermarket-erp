<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Supermarket ERP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Products</h1>

<section id="scan-section">
  <label for="scan-input">Scan barcode:</label>
  <input id="scan-input" type="text" autofocus placeholder="Focus here and scan...">
  <span id="scan-status"></span>
</section>

<section id="form-section">
  <h2 id="form-title">Add product</h2>
  <form id="product-form">
    <input type="hidden" id="product-id">
    <label>Barcode <input id="barcode" required></label>
    <label>Name <input id="name" required></label>
    <label>Description <input id="description"></label>
    <label>Price <input id="price" type="number" step="0.01" min="0" required></label>
    <label>Quantity <input id="quantity" type="number" min="0" required></label>
    <label>Supplier
      <select id="supplier-select">
        <option value="">-- none --</option>
      </select>
    </label>
    <button type="submit" id="submit-btn">Save</button>
    <button type="button" id="cancel-btn" hidden>Cancel</button>
  </form>
</section>

<section id="list-section">
  <table>
    <thead>
      <tr>
        <th>Barcode</th><th>Name</th><th>Description</th><th>Price</th><th>Qty</th><th>Supplier</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="product-table-body"></tbody>
  </table>
</section>

<hr>

<h1>Suppliers</h1>

<section id="supplier-form-section">
  <h2 id="supplier-form-title">Add supplier</h2>
  <form id="supplier-form">
    <input type="hidden" id="supplier-id">
    <label>Name <input id="supplier-name" required></label>
    <label>Contact person <input id="supplier-contact" required></label>
    <label>Phone <input id="supplier-phone" required></label>
    <label>Email <input id="supplier-email" type="email" required></label>
    <label>Address <input id="supplier-address"></label>
    <button type="submit" id="supplier-submit-btn">Save</button>
    <button type="button" id="supplier-cancel-btn" hidden>Cancel</button>
  </form>
</section>

<section id="supplier-list-section">
  <table>
    <thead>
      <tr>
        <th>Name</th><th>Contact person</th><th>Phone</th><th>Email</th><th>Address</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="supplier-table-body"></tbody>
  </table>
</section>

<script src="app.js"></script>
</body>
</html>
