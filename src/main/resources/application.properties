spring.application.name=product-crud

# --- MySQL connection ---
# Set these as environment variables before running - see README for setup.
# Example local value for MYSQL_DB_URL: jdbc:mysql://localhost:3306/supermarket_erp?createDatabaseIfNotExist=true
spring.datasource.url=${MYSQL_DB_URL}
spring.datasource.username=${MYSQL_DB_USERNAME}
spring.datasource.password=${MYSQL_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update: auto-creates/updates tables for this demo. Use validate/none in real projects (with migrations).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8081
