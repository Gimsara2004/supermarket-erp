spring.application.name=product-crud

# --- MySQL connection ---
# NOTE: replace these with your own local DB credentials before running,
# or set them as environment variables MYSQL_DB_URL / MYSQL_DB_USERNAME / MYSQL_DB_PASSWORD
# and change the 3 lines below back to ${MYSQL_DB_URL} etc.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/supermarket_erp?createDatabaseIfNotExist=true
spring.datasource.username=erpuser
spring.datasource.password=ErpPass123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update: auto-creates/updates tables for this demo. Use validate/none in real projects (with migrations).
# IMPORTANT: this update includes structural changes (new tables: locations, roles, users, inventory,
# sales_receipts, sales_receipt_items, payments; and a changed column type on goods_received_notes.received_by,
# which switches from a free-text name to a foreign key). Hibernate's "update" mode cannot safely alter an
# existing column's type, so if you are upgrading an existing database, either drop it and let it be
# recreated fresh, or run "DROP DATABASE supermarket_erp;" once before starting the app.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8081
